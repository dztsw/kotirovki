<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#0b0e13">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Котировки">
  <title>Котировки</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="style.css">
</head>
<body>
<!--APP-->
  <div class="app">
    <header class="bar">
      <div class="bar-row">
        <h1 id="tabTitle">Крипта</h1>
        <div class="bar-act">
          <span id="conn" class="conn"></span>
          <button id="profileBtn" class="icon-btn avatar" aria-label="Профиль"><svg viewBox="0 0 24 24"><circle cx="12" cy="8.5" r="3.6"/><path d="M5 19.5c1.2-3.3 3.9-5 7-5s5.8 1.7 7 5"/></svg></button>
        </div>
      </div>
      <p id="tabSub" class="bar-sub"></p>
      <label class="search">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l4.5 4.5"/></svg>
        <input id="search" type="search" autocomplete="off" autocapitalize="characters" spellcheck="false" placeholder="Поиск">
      </label>
    </header>

    <main class="list-wrap">
      <ul id="list" class="list"></ul>
      <p id="listNote" class="note"></p>
    </main>

    <nav class="tabs" id="tabs">
      <button data-tab="crypto"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M10 7.5v9M10 8h3.2a2 2 0 010 4H10m0 0h3.7a2.1 2.1 0 010 4.2H10M11.5 6v2m0 8.2v1.8"/></svg><span>Крипта</span></button>
      <button data-tab="fiat"><svg viewBox="0 0 24 24"><path d="M4 8h13l-3-3M20 16H7l3 3"/></svg><span>Валюты</span></button>
      <button data-tab="stocks"><svg viewBox="0 0 24 24"><path d="M6 4v16M12 7v13M18 3v15"/><rect x="4.5" y="8" width="3" height="6" rx=".5"/><rect x="10.5" y="10" width="3" height="5" rx=".5"/><rect x="16.5" y="5" width="3" height="7" rx=".5"/></svg><span>Акции</span></button>
      <button data-tab="metals"><svg viewBox="0 0 24 24"><path d="M3.5 18.5l2.5-6h5l2.5 6zM10.5 18.5l2.5-6h5l2.5 6zM7 11.5l2.5-6h5l2.5 6z"/></svg><span>Металлы</span></button>
      <button data-tab="favs"><svg viewBox="0 0 24 24"><path d="M12 4l2.4 5 5.4.6-4 3.7 1.1 5.3L12 16l-4.9 2.6 1.1-5.3-4-3.7 5.4-.6z"/></svg><span>Избранное</span></button>
    </nav>

    <section id="detail" class="detail" hidden aria-modal="true" role="dialog">
      <header class="d-bar">
        <button id="back" class="icon-btn" aria-label="Назад"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button>
        <div class="d-title"><b id="dSym"></b><small id="dName"></small></div>
        <button id="dFav" class="icon-btn" aria-label="В избранное"><svg viewBox="0 0 24 24"><path d="M12 4l2.4 5 5.4.6-4 3.7 1.1 5.3L12 16l-4.9 2.6 1.1-5.3-4-3.7 5.4-.6z"/></svg></button>
      </header>
      <div class="d-scroll">
        <div class="d-price">
          <div id="dPrice" class="big">—</div>
          <div class="d-meta"><span id="dChg" class="pill"></span><span id="dChgLabel" class="muted"></span><span id="dLive" class="conn"></span></div>
        </div>
        <div class="d-controls">
          <div id="tfs" class="seg" role="tablist" aria-label="Таймфрейм"></div>
          <div id="ctype" class="seg seg-sm" aria-label="Вид графика">
            <button data-type="area" aria-label="Линия"><svg viewBox="0 0 24 24"><path d="M3 17l5-6 4 3 4-7 5 5"/></svg></button>
            <button data-type="candles" aria-label="Свечи"><svg viewBox="0 0 24 24"><path d="M7 3v18M17 3v18"/><rect x="5" y="7" width="4" height="9" rx=".5"/><rect x="15" y="5" width="4" height="7" rx=".5"/></svg></button>
          </div>
        </div>
        <div class="chart-box">
          <div id="legend" class="legend"></div>
          <div id="chart" class="chart"></div>
          <div id="chartMsg" class="chart-msg"></div>
        </div>
        <dl id="dStats" class="stats"></dl>
        <p id="dSource" class="note"></p>
        <button id="dRemove" class="text-btn" hidden>Убрать из списка</button>
      </div>
    </section>

    <section id="profile" class="detail" hidden aria-modal="true" role="dialog" aria-labelledby="pTitle">
      <header class="d-bar">
        <button id="pBack" class="icon-btn" aria-label="Назад"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button>
        <div class="d-title"><b id="pTitle">Профиль</b><small>Данные хранятся на этом устройстве</small></div>
        <span class="icon-btn" aria-hidden="true"></span>
      </header>
      <div class="d-scroll">
        <section class="p-sec">
          <h2>Портфель</h2>
          <div id="pTotals" class="p-totals"></div>
          <ul id="pList" class="list"></ul>
          <form id="pForm" class="p-form" hidden>
            <label>Инструмент<select id="pInst"></select></label>
            <div class="p-form-row">
              <label>Количество<input id="pQty" type="number" inputmode="decimal" step="any" min="0" required placeholder="0,5"></label>
              <label>Цена покупки<input id="pBuy" type="number" inputmode="decimal" step="any" min="0" placeholder="текущая"></label>
            </div>
            <div class="p-form-row">
              <button type="submit" class="btn primary">Сохранить</button>
              <button type="button" id="pCancel" class="btn">Отмена</button>
            </div>
            <button type="button" id="pDelete" class="text-btn" hidden>Удалить позицию</button>
          </form>
          <button id="pAdd" class="btn wide">+ Добавить позицию</button>
        </section>

        <section class="p-sec">
          <h2>Настройки</h2>
          <div class="p-row"><span>Тема</span>
            <div id="pTheme" class="seg seg-text">
              <button data-v="system">Авто</button><button data-v="dark">Тёмная</button><button data-v="light">Светлая</button>
            </div>
          </div>
          <div class="p-row"><span>Биржа для крипты</span>
            <div id="pEx" class="seg seg-text">
              <button data-v="auto">Авто</button><button data-v="binance">Binance</button><button data-v="bybit">Bybit</button>
            </div>
          </div>
        </section>

        <section class="p-sec">
          <h2>Источники данных</h2>
          <ul id="pDiag" class="diag"></ul>
          <button id="pCheck" class="btn wide">Проверить все источники</button>
        </section>

        <section class="p-sec">
          <h2>Резервная копия</h2>
          <p class="note">Избранное, списки, портфель и настройки. Скопируйте текст и вставьте на другом устройстве.</p>
          <div class="p-form-row">
            <button id="pExport" class="btn">Скопировать</button>
            <button id="pImport" class="btn">Восстановить</button>
          </div>
          <textarea id="pBackup" class="p-backup" hidden spellcheck="false" placeholder="Вставьте сюда резервную копию"></textarea>
          <button id="pRestore" class="btn primary wide" hidden>Применить копию</button>
          <p id="pBackupMsg" class="note"></p>
          <button id="pReset" class="text-btn">Сбросить все данные</button>
        </section>
      </div>
    </section>
  </div>
<!--/APP-->
  <script src="vendor/lightweight-charts.standalone.production.js"></script>
  <script src="app.js"></script>
</body>
</html>
